<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Canonical (VERY IMPORTANT for Google identity reset) -->
    <link rel="canonical" href="https://rohithsiliveri.com/" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/Logo.png" />

    <!-- Page Title -->
    <title>Rohith Siliveri</title>

    <!-- SEO Meta -->
    <meta
      name="description"
      content="Rohith Siliveri – Applied AI Engineer focused on Generative AI, LLMs, agentic systems, AI evaluation, and production machine learning."
    />
    <meta name="author" content="Rohith Siliveri" />

    <!-- Open Graph / LinkedIn -->
    <meta property="og:site_name" content="Rohith Siliveri" />
    <meta property="og:title" content="Rohith Siliveri" />
    <meta
      property="og:description"
      content="Applied AI Engineer focused on Generative AI, LLMs, agentic systems, AI evaluation, and production machine learning."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rohithsiliveri.com" />
    <meta
      property="og:image"
      content="https://rohithsiliveri.com/og-image.png"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rohith Siliveri" />
    <meta
      name="twitter:description"
      content="Applied AI Engineer focused on Generative AI, LLMs, agentic systems, and AI evaluation."
    />
    <meta
      name="twitter:image"
      content="https://rohithsiliveri.com/og-image.png"
    />
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
